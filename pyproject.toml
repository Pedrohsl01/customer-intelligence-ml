[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-intel"
version = "0.1.0"
description = "Pipeline de Customer Intelligence (RFM + K-Means + personas via LLM) para o SaaS multi-tenant"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
